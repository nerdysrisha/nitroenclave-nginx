apiVersion: v1
kind: ServiceAccount
metadata:
  name: nitro-enclave-sa
  namespace: integrations   
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::908774804544:role/NitroEnclaveKMSRole
    
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-enclave-deployment
  namespace: integrations
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nginx-enclave
  template:
    metadata:
      labels:
        app: nginx-enclave
    spec:
      serviceAccountName: nitro-enclave-sa  
      containers:
      - name: nginx-container
        image: nerdysrisha/nginx-aws-nitro:latest
        imagePullPolicy: Always
        ports:
          - containerPort: 80
        resources:
          limits:
            aws.ec2.nitro/nitro_enclaves: 1
            hugepages-2Mi: 2048Mi
            cpu: 1000m
            memory: 2Gi
          requests:
            aws.ec2.nitro/nitro_enclaves: 1
            hugepages-2Mi: 2048Mi
            cpu: 1000m
            memory: 2Gi
        volumeMounts:
        - mountPath: /dev/hugepages
          name: hugepage
          readOnly: false
        - mountPath: /dev/vsock
          name: vsock-device
        securityContext:
          privileged: true
          capabilities:
            add:
              - SYS_ADMIN
              - NET_ADMIN
      volumes:
      - name: hugepage
        emptyDir:
          medium: HugePages-2Mi
      - name: vsock-device
        hostPath:
          path: /dev/vsock
      tolerations:
      - effect: NoSchedule
        operator: Exists
      - effect: NoExecute
        operator: Exists
      - key: aws.ec2.nitro/nitro_enclaves
        operator: Exists
        effect: NoSchedule
